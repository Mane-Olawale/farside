# Local development relay for make server-up (plan section 12: the forced-relay switch needs a
# relay). Not for a public server: private peer addresses are allowed here because both
# devices and the relay are on one home network. Use turnserver.conf for a real deployment.
listening-port=3478
fingerprint
use-auth-secret
realm=farside.local
# A small port range, published by Docker Compose.
min-port=49160
max-port=49200
no-cli
no-tls
no-dtls
no-multicast-peers
user-quota=4
total-quota=50
# Logs to the container output, for docker compose logs.
log-file=stdout
