// Farside wire protocol, version 1.1 (plan sections 9, 10, 11 and 21 C).
//
// 1.0: handshake, stream config, displays, ping, bye.
// 1.1: input (30s) and cursor (40s) messages, Phase 2.
//
// Every data channel message is exactly one Envelope. The channel keeps message boundaries,
// so there is no length prefix.
//
// Rules (plan section 11, versioning):
// - Fields are only ever added. Field numbers are never reused.
// - A removed field or message is marked reserved, never deleted.
// - Envelope body numbers follow the plan's catalog, so later phases fill in the gaps
//   (19 KeyFrameRequest, 30s input, 40s cursor, 50s clipboard, 60 Chunk) without renumbering.
// - Run `make proto` after any change and commit the generated Swift. CI fails if it differs.

syntax = "proto3";

package farside.v1;

message Envelope {
  uint32 seq = 1;         // Per channel, wraps.
  uint64 sent_at_us = 2;  // Sender's monotonic clock, microseconds.

  oneof body {
    // control
    Hello hello = 10;
    HelloAck hello_ack = 11;
    StreamConfig stream_config = 12;
    StreamConfigApplied stream_config_applied = 13;
    DisplayList display_list = 14;
    Ping ping = 15;
    Pong pong = 16;
    Pause pause = 17;    // 1.2
    Resume resume = 18;  // 1.2
    Notice notice = 20;  // 1.2
    Bye bye = 23;

    // input, iPad to Mac (reliable `input` channel unless noted)
    PointerMove pointer_move = 30;      // `pointer` channel
    PointerDelta pointer_delta = 31;    // `pointer` channel
    Button button = 32;
    Scroll scroll = 33;
    Key key = 34;
    Text text = 35;
    ReleaseAll release_all = 36;
    // 37 is TabletSample, Phase 6.
    InputHeartbeat input_heartbeat = 38;  // `pointer` channel

    // cursor, Mac to iPad
    CursorShape cursor_shape = 40;        // `control` channel
    CursorState cursor_state = 41;        // `control` channel
    CursorPosition cursor_position = 42;  // `cursor` channel
  }
}

enum VideoCodec {
  VIDEO_CODEC_UNSPECIFIED = 0;
  VIDEO_CODEC_HEVC = 1;
  VIDEO_CODEC_H264 = 2;
}

// The toolbar's quality setting (plan section 7). The host decides what it means.
enum QualityPreference {
  QUALITY_PREFERENCE_UNSPECIFIED = 0;
  QUALITY_PREFERENCE_BALANCED = 1;
  QUALITY_PREFERENCE_SHARPER = 2;
  QUALITY_PREFERENCE_SMOOTHER = 3;
}

// Plan section 15, end reasons.
enum EndReason {
  END_REASON_UNSPECIFIED = 0;
  END_REASON_USER_ENDED = 1;
  END_REASON_HOST_ENDED = 2;
  END_REASON_TAKEN_OVER = 3;
  END_REASON_RING_TIMEOUT = 4;
  END_REASON_PATH_TIMEOUT = 5;
  END_REASON_AUTH_FAILED = 6;
  END_REASON_VERSION_MISMATCH = 7;
  END_REASON_PERMISSION_MISSING = 8;
  END_REASON_HOST_SLEEPING = 9;
  END_REASON_NETWORK_LOST = 10;
  END_REASON_INTERNAL_ERROR = 11;
  // Another device is already in a session with this Mac (plan section 7, error messages).
  // Take over arrives in Phase 4.
  END_REASON_BUSY = 12;
}

// What a device can do. The host uses only what both sides list.
message Capabilities {
  repeated VideoCodec codecs = 1;  // In order of preference.
  uint32 max_width = 2;            // Pixels.
  uint32 max_height = 3;
  uint32 max_frame_rate = 4;
  bool audio = 5;
  bool tablet = 6;
  bool clipboard = 7;
  bool long_term_reference = 8;
}

// iPad to Mac, first message on `control`.
message Hello {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string app_version = 3;
  string device_model = 4;
  string os_version = 5;
  Capabilities capabilities = 6;
  bytes session_nonce = 7;
  bytes identity_signature = 8;  // Binds the device key to this connection. Empty until Phase 3.
  bytes resume_token = 9;        // Optional.
  string device_name = 10;
}

// Mac to iPad, after it accepts Hello.
message HelloAck {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string app_version = 3;
  string device_model = 4;
  string os_version = 5;
  Capabilities capabilities = 6;
  bytes session_nonce = 7;
  bytes identity_signature = 8;  // Empty until Phase 3.
  bytes resume_token = 9;        // New token for this session.
  string device_name = 10;
}

// iPad to Mac: what the iPad would like. The Mac decides.
message StreamConfig {
  uint32 display_id = 1;
  uint32 width = 2;   // Pixels. Zero means the host picks.
  uint32 height = 3;
  uint32 frame_rate = 4;
  repeated VideoCodec codec_preference = 5;
  QualityPreference quality = 6;
  bool audio = 7;
}

// A rectangle in stream pixels.
message Rect {
  float x = 1;
  float y = 2;
  float width = 3;
  float height = 4;
}

// Mac to iPad: what the Mac actually applied. Authoritative.
message StreamConfigApplied {
  uint32 display_id = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 frame_rate = 4;
  VideoCodec codec = 5;
  QualityPreference quality = 6;
  bool audio = 7;
  Rect content_rect = 8;  // Where the display sits inside the stream frame.
  float scale = 9;        // Stream pixels per display point.
}

// One Mac display (plan section 10).
message Display {
  uint32 id = 1;  // CGDirectDisplayID.
  string name = 2;
  uint32 pixel_width = 3;
  uint32 pixel_height = 4;
  double point_width = 5;
  double point_height = 6;
  double scale = 7;
  double origin_x = 8;  // In the global coordinate space, points.
  double origin_y = 9;
  bool main = 10;
  bool built_in = 11;
  double refresh_rate = 12;
}

// Mac to iPad, on connect and whenever the display configuration changes.
message DisplayList {
  repeated Display displays = 1;
}

// Both ways, once a second. Round trip time and clock offset.
message Ping {
  uint64 sender_time_us = 1;
}

message Pong {
  uint64 ping_sender_time_us = 1;  // Echoed from the Ping.
  uint64 receiver_time_us = 2;     // The ponging side's clock when the Ping arrived.
}

// iPad to Mac: the app left the foreground. The Mac stops capture and releases held input,
// and keeps the session for a while (plan section 15, paused). 1.2.
message Pause {}

// iPad to Mac: back in the foreground. Accepted only with this session's resume token. 1.2.
message Resume {
  bytes resume_token = 1;
}

// Mac to iPad: something the person should know that does not end the session, such as a
// permission lost mid-session (plan section 15). 1.2.
message Notice {
  NoticeCode code = 1;
  string detail = 2;  // Diagnostics only. Never shown raw.
}

enum NoticeCode {
  NOTICE_CODE_UNSPECIFIED = 0;
  NOTICE_CODE_SCREEN_RECORDING_LOST = 1;
  NOTICE_CODE_ACCESSIBILITY_LOST = 2;
}

// Either way: a clean end.
message Bye {
  EndReason reason = 1;
  string detail = 2;  // Diagnostics only. Never shown raw.
}

// MARK: Input (plan section 9)
//
// Positions are normalized to 0...1 across the display's bounds, so pixels and Retina scale never
// cross the wire. The Mac maps them to points in its global coordinate space.

// Mouse buttons. In `PointerMove.buttons` each is the bit 1 << (button - 1).
enum MouseButton {
  MOUSE_BUTTON_UNSPECIFIED = 0;
  MOUSE_BUTTON_LEFT = 1;
  MOUSE_BUTTON_RIGHT = 2;
  MOUSE_BUTTON_MIDDLE = 3;
}

// Pointer moved. Newest wins: the Mac drops one older than the newest it has posted, using the
// envelope `seq`. Posted as a drag while a button is held.
message PointerMove {
  uint32 display_id = 1;
  float x = 2;        // 0...1 across the display.
  float y = 3;        // 0...1 down the display.
  uint32 buttons = 4;  // Held buttons, bit set (see MouseButton).
}

// Relative movement, for pointer lock and trackpad mode.
message PointerDelta {
  float dx = 1;  // Points.
  float dy = 2;
}

message Button {
  MouseButton button = 1;
  bool down = 2;
  uint32 click_count = 3;  // 1 for a single click, 2 for the second click of a double click.
  uint32 display_id = 4;
  float x = 5;  // 0...1, where the click happens.
  float y = 6;
}

// Gesture phases, as NSEvent.Phase uses them.
enum ScrollPhase {
  SCROLL_PHASE_NONE = 0;
  SCROLL_PHASE_BEGAN = 1;
  SCROLL_PHASE_CHANGED = 2;
  SCROLL_PHASE_ENDED = 3;
  SCROLL_PHASE_CANCELLED = 4;
  SCROLL_PHASE_MAY_BEGIN = 5;
}

message Scroll {
  float dx = 1;  // Points when continuous, lines when not.
  float dy = 2;
  ScrollPhase phase = 3;
  ScrollPhase momentum_phase = 4;
  bool continuous = 5;  // A trackpad gesture rather than a mouse wheel.
}

// Modifier bits for Key.modifiers. The low byte is the USB HID modifier byte, left and right kept
// apart, so the Mac can compare it with the keys it has posted. Function and Caps Lock follow.
// The iPad builds this set from the modifier keys it has seen go down (spike S7).
enum Modifier {
  MODIFIER_NONE = 0;
  MODIFIER_LEFT_CONTROL = 0x01;
  MODIFIER_LEFT_SHIFT = 0x02;
  MODIFIER_LEFT_OPTION = 0x04;
  MODIFIER_LEFT_COMMAND = 0x08;
  MODIFIER_RIGHT_CONTROL = 0x10;
  MODIFIER_RIGHT_SHIFT = 0x20;
  MODIFIER_RIGHT_OPTION = 0x40;
  MODIFIER_RIGHT_COMMAND = 0x80;
  MODIFIER_FUNCTION = 0x100;
  // The iPad's Caps Lock is on. The Mac applies it as Shift on letters and never posts Caps Lock
  // (spike S2).
  MODIFIER_CAPS_LOCK = 0x200;
}

message Key {
  uint32 hid_usage = 1;  // USB HID keyboard usage, page 7.
  bool down = 2;
  uint32 modifiers = 3;  // Full set after this event, bit set (see Modifier).
}

// Committed text from the software keyboard, dictation or an input method.
message Text {
  string text = 1;
}

// Release every key and button the Mac holds for this session.
message ReleaseAll {}

// Sent while any key or button is held, so the Mac can stop repeats and release input when the
// iPad goes quiet.
message InputHeartbeat {}

// MARK: Cursor (plan section 10)

// A cursor image, sent once per distinct shape. Later messages refer to it by id.
message CursorShape {
  uint32 id = 1;
  bytes png = 2;      // At `scale` pixels per point.
  float width = 3;    // Points.
  float height = 4;
  float hot_x = 5;    // Points from the top left.
  float hot_y = 6;
  float scale = 7;
}

message CursorState {
  uint32 shape_id = 1;
  bool visible = 2;
}

// Where the cursor is, sent only when something other than this iPad moved it.
message CursorPosition {
  uint32 display_id = 1;
  float x = 2;  // 0...1 across the display.
  float y = 3;
  uint32 last_input_seq = 4;  // Envelope seq of the newest PointerMove the Mac had posted.
}
