# The backend's tests and formatting (plan section 13).
name: Backend

# Runs only when a push or pull request changes something this workflow depends on. A change
# to the docs or the deploy files alone runs nothing.
on:
  push:
    paths:
      - "Server/api/**"
      - "Makefile"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "Server/api/**"
      - "Makefile"
      - ".github/workflows/server.yml"

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, sodium, intl
          coverage: none

      - uses: actions/cache@v6
        with:
          path: Server/api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('Server/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Test and check formatting
        run: make server-test
