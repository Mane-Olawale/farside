# Package tests and both app builds on every push (plan section 5, tooling). Hardware codec,
# capture and input tests need a Mac with privacy grants and run on a self-hosted machine later
# (plan section 17); nothing here needs a grant or a signing identity.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packages:
    name: Package tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version

      # SwiftPM build products and the pinned WebRTC binary (46 MB) per package.
      - uses: actions/cache@v6
        with:
          path: Packages/*/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # protoc 34.1, the version used locally, pinned by checksum. make proto builds
      # protoc-gen-swift from the swift-protobuf version pinned in WireProtocol.
      - name: Install protoc
        run: |
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            https://github.com/protocolbuffers/protobuf/releases/download/v34.1/protoc-34.1-osx-aarch_64.zip
          echo "2c7e92b8b578916937df132b3032e2e8e6c170862ecf7a8333094a6f3d03650c  $RUNNER_TEMP/protoc.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"

      # Plan section 5, rule 6: fails if the committed generated code is stale.
      - name: Check generated protocol code
        run: make proto-check PROTOC="$RUNNER_TEMP/protoc/bin/protoc"

      - name: Test
        run: make test

  apps:
    name: App builds
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - uses: actions/cache@v6
        with:
          path: .build/DerivedData/SourcePackages
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Packages/*/Package.swift', 'project.yml') }}
          restore-keys: spm-xcode-${{ runner.os }}-

      # Unsigned builds: Config/Local.xcconfig is not committed, and the Makefile turns signing off.
      - name: Build the iPad client
        run: make build-client

      - name: Build the Mac host
        run: make build-host
