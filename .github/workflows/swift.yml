# Package tests (plan section 5, tooling). Hardware codec, capture and input tests need a Mac with
# privacy grants and run on a self-hosted machine later (plan section 17).
name: Swift packages

# Runs only when a push or pull request changes something this workflow depends on. A change
# to the docs or the deploy files alone runs nothing.
on:
  push:
    paths:
      - "Packages/**"
      - "Apps/**"
      - "Makefile"
      - ".github/workflows/swift.yml"
  pull_request:
    paths:
      - "Packages/**"
      - "Apps/**"
      - "Makefile"
      - ".github/workflows/swift.yml"

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packages:
    name: Package tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version

      # SwiftPM build products and the pinned WebRTC binary (46 MB) per package.
      - uses: actions/cache@v6
        with:
          path: Packages/*/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # protoc 34.1, the version used locally, pinned by checksum. make proto builds
      # protoc-gen-swift from the swift-protobuf version pinned in WireProtocol.
      - name: Install protoc
        run: |
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            https://github.com/protocolbuffers/protobuf/releases/download/v34.1/protoc-34.1-osx-aarch_64.zip
          echo "2c7e92b8b578916937df132b3032e2e8e6c170862ecf7a8333094a6f3d03650c  $RUNNER_TEMP/protoc.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"

      # Plan section 5, rule 6: fails if the committed generated code is stale.
      - name: Check generated protocol code
        run: make proto-check PROTOC="$RUNNER_TEMP/protoc/bin/protoc"

      - name: Pinned trust only in the apps
        run: make trust-check

      - name: Test
        run: make test
